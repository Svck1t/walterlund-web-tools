<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c2733">
<title>WalterLund | Control de Gas</title>
<style>
  html, body { margin: 0; background: #eef1f4; }
  .ll-top { background: #1c2733; color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 10px; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
  .ll-top span { background: #1565c0; border-radius: 6px; width: 28px; height: 28px; display: grid; place-items: center; }
  #app { max-width: 1280px; margin: 0 auto; padding: 20px 24px calc(24px + env(safe-area-inset-bottom)); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1c2733; }
  @media (max-width: 700px) { #app { padding: 16px 14px calc(24px + env(safe-area-inset-bottom)); } }
</style>
</head>
<body>
  <!-- Link externo de Control de Gas (para los encargados de sucursal desde el celular).
       Usa EXACTAMENTE los mismos archivos que la sección de la web (js/compras-assets/), así ambos se ven igual. -->
  <div class="ll-top"><span>W</span>WalterLund</div>
  <div id="app"></div>
  <script>
    if (typeof describeError === 'undefined') window.describeError = e => (e && e.message) || String(e);
  </script>
  <script src="/js/compras.js"></script>
  <script>ComprasSection.render(document.getElementById('app'));</script>
</body>
</html>
