<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía Softland</title>
<style>
  @page { size: A4; margin: 0 }
  body { margin: 0; background: #e9e9e9; font-family: Arial, sans-serif }
  .pag { page-break-after: always }
  .pag:last-child { page-break-after: auto }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact }
  .t { position: absolute; white-space: pre }
  #bar { position: sticky; top: 0; z-index: 9; background: #1f2937; color: #fff; padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
  #bar button { padding: 7px 14px; border: 0; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; font-size: 14px }
  #bar .sec { background: #374151 }
  #titulo { font-weight: 600 }
  #msg { font-size: 13px; opacity: .9 }
  #hojas { padding: 16px 0; overflow-x: auto }
  #hojas .pag { margin: 0 auto 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, .25) }
  body.embed #bar { display: none }
  body.embed { background: #f3f4f6 }
  body.embed #hojas { padding: 6px 0 }
  @media print {
    #bar { display: none }
    html, body { background: #fff; height: auto; overflow: visible }
    #hojas { padding: 0 !important; overflow: visible }
    /* una sola hoja: sin salto extra y un pelo más baja que el A4 para que no se cree una 2ª hoja en blanco */
    #hojas .pag { margin: 0 !important; box-shadow: none; zoom: 1 !important; break-after: auto; page-break-after: auto; height: 841pt !important }
  }
</style>
</head>
<body>
<div id="bar">
  <span id="titulo">Guía</span>
  <button onclick="window.print()">🖨️ Imprimir</button>
  <button onclick="descargarPdf()">⬇️ Descargar PDF</button>
  <button class="sec" onclick="window.close()">Cerrar</button>
  <span id="msg">Cargando…</span>
</div>
<div id="hojas"></div>

<script src="js/vendor/bwip-js-min.js"></script>
<script src="js/guiaSoftland.js"></script>
<script src="js/numLetras.js"></script>
<script>
// Visor de guías con el formato de impresión de Softland.
// Uso: guia.html?guia=S15837 (salida)  ·  guia.html?guia=ET15837 (entrada de esa salida)
(async () => {
  const embed = new URLSearchParams(location.search).get('embed') === '1';
  if (embed) document.body.classList.add('embed');
  const msg = document.getElementById('msg');
  const avisar = t => { msg.textContent = t; if (embed) document.getElementById('hojas').innerHTML = t ? `<p style="text-align:center;color:#6b7280;font:14px Arial;padding:40px 10px">${t}</p>` : ''; };
  avisar('Cargando…');
  const clave = (new URLSearchParams(location.search).get('guia') || '').toUpperCase();
  const nombre = clave.startsWith('ET') ? `Guía de entrada (traslado ${clave.slice(2)})`
    : /^E[FB]/.test(clave) ? `Guía de entrada por devolución (${clave[1] === 'B' ? 'boleta' : 'factura'} ${clave.slice(2)})`
    : `Guía de salida ${clave.slice(1)}`;
  document.getElementById('titulo').textContent = nombre;
  document.title = nombre;
  window.guiaArchivo = nombre.replace(/[()]/g, '').replace(/\s+/g, '_') + '.pdf';
  try {
    if (!clave) throw new Error('Falta indicar la guía');
    const [tpls, resp] = await Promise.all([
      fetch('data/guias-plantillas.json').then(r => r.json()),
      fetch('/api/guia?guia=' + encodeURIComponent(clave), { cache: 'no-store' }).then(r => r.json())
    ]);
    if (!resp.ok) {
      if (/^E[FB]/.test(clave) && /no encontrada/i.test(resp.error || ''))
        throw new Error('Softland no registra una guía de entrada por devolución para esta ' + (clave[1] === 'B' ? 'boleta' : 'factura') +
          '. Puede que la NC aún no se haya hecho en el sistema, que no haya tenido devolución de mercadería o que se haya emitido con otra referencia.');
      throw new Error(resp.error || 'No se pudo leer la guía');
    }
    const g = resp.guia;
    if (g.plantilla === 'devolucion' && !g.totalLetras) g.totalLetras = NumLetras.letras(g.netoNum);
    if (g.ted) {
      const c = document.createElement('canvas');
      bwipjs.toCanvas(c, { bcid: 'pdf417', text: g.ted, eclevel: 5, columns: 12, rowheight: 3, scale: 2 });
      g.timbre = c.toDataURL('image/png');
    }
    msg.textContent = '';
    document.getElementById('hojas').innerHTML = GuiaSoftland.renderGuia(tpls[g.plantilla], g);
    // en pantallas angostas, achica la hoja para que quepa a lo ancho (no afecta la impresión)
    const ajustar = () => {
      const pag = document.querySelector('#hojas .pag'); if (!pag) return;
      const z = Math.min(1, (window.innerWidth - 12) / pag.offsetWidth);
      pag.style.zoom = z < 1 ? z : '';
    };
    ajustar(); window.addEventListener('resize', ajustar);
    window.addEventListener('beforeprint', () => { const pag = document.querySelector('#hojas .pag'); if (pag) pag.style.zoom = ''; });
    window.addEventListener('afterprint', ajustar);
  } catch (e) {
    avisar('⚠️ ' + e.message);
  }
})();
// Descarga la guía como PDF (sin pasar por el diálogo de impresión)
const cargarJs = src => new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); });
async function descargarPdf() {
  const pag = document.querySelector('#hojas .pag');
  if (!pag) return;
  await cargarJs('js/vendor/html2canvas.min.js');
  await cargarJs('js/vendor/jspdf.umd.min.js');
  const zoom = pag.style.zoom; pag.style.zoom = '';
  try {
    const canvas = await html2canvas(pag, { scale: 3, backgroundColor: '#fff', useCORS: true, logging: false });
    const w = parseFloat(pag.style.width), h = parseFloat(pag.style.height);
    const pdf = new jspdf.jsPDF({ unit: 'pt', format: [w, h], orientation: 'portrait' });
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, w, h);
    pdf.save(window.guiaArchivo || 'guia.pdf');
  } finally { pag.style.zoom = zoom; }
}
window.descargarPdf = descargarPdf;
</script>
</body>
</html>
